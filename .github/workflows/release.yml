name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build remote bridges (Go)
        run: |
          mkdir -p build
          cd remote/bridge
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS=${target%/*}; ARCH=${target#*/}
            OUT="../../build/agentisland-remote-bridge-${OS}-${ARCH}"
            GOOS=$OS GOARCH=$ARCH go build -o "$OUT" .
          done
          ls -la ../../build/agentisland-remote-bridge-*

      - name: Build universal app
        run: bash scripts/build-app.sh release

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="dev-$(date +%Y%m%d%H%M)"
          fi
          DMG="build/AgentIsland-${VERSION}.dmg"
          hdiutil create -volname "AgentIsland" \
            -srcfolder build/AgentIsland.app \
            -ov -format UDZO "$DMG"
          echo "DMG_PATH=$DMG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate Sparkle appcast (placeholder)
        run: |
          cat > build/appcast.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>AgentIsland</title>
              <item>
                <title>${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <enclosure url="https://github.com/anthropics/agentisland/releases/download/v${VERSION}/$(basename "$DMG_PATH")"
                           sparkle:version="${VERSION}"
                           length="$(stat -f%z "$DMG_PATH")"
                           type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG_PATH }}
            build/appcast.xml
            build/agentisland-remote-bridge-*
