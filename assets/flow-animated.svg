<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c0e18"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="hexF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd96b"/>
      <stop offset="100%" stop-color="#c98c1e"/>
    </linearGradient>
  </defs>
  <rect width="880" height="280" fill="url(#flowBg)" rx="10"/>

  <!-- nodes -->
  <g font-size="12" fill="#fff">
    <!-- Claude Code -->
    <rect x="40" y="100" width="140" height="60" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="110" y="125" text-anchor="middle" font-weight="600">Claude Code</text>
    <text x="110" y="145" text-anchor="middle" opacity="0.55" font-size="11">running a tool</text>

    <!-- bridge -->
    <rect x="240" y="100" width="160" height="60" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="320" y="120" text-anchor="middle" font-weight="600">agentisland-bridge</text>
    <text x="320" y="138" text-anchor="middle" opacity="0.55" font-size="11">PreToolUse hook</text>
    <text x="320" y="152" text-anchor="middle" opacity="0.55" font-size="11">unix socket</text>

    <!-- app -->
    <rect x="460" y="80" width="180" height="100" rx="12" fill="#0a0a0a" stroke="#3a2e16" stroke-width="1.5"/>
    <polygon points="486,118 494,111 502,111 510,118 502,125 494,125" fill="url(#hexF)"/>
    <text x="540" y="118" font-weight="600">AgentIsland.app</text>
    <text x="540" y="138" opacity="0.6" font-size="11">• approval queue</text>
    <text x="540" y="152" opacity="0.6" font-size="11">• danger detector</text>
    <text x="540" y="166" opacity="0.6" font-size="11">• notch + popover</text>

    <!-- you -->
    <rect x="700" y="100" width="140" height="60" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="770" y="125" text-anchor="middle" font-weight="600">You</text>
    <text x="770" y="145" text-anchor="middle" opacity="0.55" font-size="11">click ✓ / ✗ / option</text>
  </g>

  <!-- arrows + animated dots -->
  <g stroke="#5ac8fa" stroke-width="1.5" fill="#5ac8fa">
    <!-- arrow 1: claude → bridge -->
    <line x1="180" y1="130" x2="240" y2="130"/>
    <polygon points="240,130 232,126 232,134"/>
    <text x="210" y="118" font-size="10" text-anchor="middle">tool_input</text>
    <circle r="4">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 180 130 L 240 130"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- arrow 2: bridge → app -->
    <line x1="400" y1="130" x2="460" y2="130"/>
    <polygon points="460,130 452,126 452,134"/>
    <text x="430" y="118" font-size="10" text-anchor="middle">JSON-RPC</text>
    <circle r="4">
      <animateMotion dur="3s" begin="0.3s" repeatCount="indefinite" path="M 400 130 L 460 130"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </circle>

    <!-- arrow 3: app ↔ you -->
    <line x1="640" y1="130" x2="700" y2="130"/>
    <polygon points="700,130 692,126 692,134"/>
    <text x="670" y="118" font-size="10" text-anchor="middle">notch card</text>
    <circle r="4">
      <animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M 640 130 L 700 130"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- return path: you → app → bridge → claude -->
  <g stroke="#34d399" stroke-width="1.5" fill="#34d399">
    <path d="M 770 162 L 770 220 L 110 220 L 110 162" fill="none"/>
    <polygon points="110,162 106,170 114,170"/>
    <text x="440" y="240" font-size="10" text-anchor="middle">permissionDecision: allow | deny</text>
    <circle r="4">
      <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"
        path="M 770 162 L 770 220 L 110 220 L 110 162"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="440" y="32" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">How a tool call flows through Agent Island</text>
</svg>
