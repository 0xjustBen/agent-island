<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">
  <!-- background: desktop wallpaper -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d2e"/>
      <stop offset="100%" stop-color="#0c0e18"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd96b"/>
      <stop offset="100%" stop-color="#c98c1e"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="460" fill="url(#bg)" rx="10"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="880" height="34" fill="#000" opacity="0.85"/>
  <text x="20" y="22" fill="#fff" font-size="13" font-weight="600">  AgentIsland</text>
  <text x="780" y="22" fill="#fff" font-size="13" opacity="0.7">19:04  ⌘</text>

  <!-- notch (camera carve) -->
  <path d="M 380 0 L 380 22 Q 380 32 390 32 L 490 32 Q 500 32 500 22 L 500 0 Z" fill="#000"/>

  <!-- collapsed pill behind notch (drops out of it) -->
  <g id="pill">
    <rect x="300" y="2" width="280" height="32" rx="16" fill="url(#pillBg)" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- left wing: brand icon + title -->
    <polygon points="318,18 326,11 334,11 342,18 334,25 326,25" fill="url(#hex)"/>
    <text x="350" y="22" fill="#fff" font-size="11" font-weight="500">agent-island · Working…</text>
    <!-- right wing: pending count badge -->
    <rect x="540" y="11" width="20" height="14" rx="7" fill="#ff3b30">
      <animate attributeName="opacity" values="1;0.55;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="550" y="22" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">1</text>
  </g>

  <!-- arrow: click -->
  <g transform="translate(440,55)">
    <text fill="#7dd3fc" font-size="11" text-anchor="middle">▼ click</text>
  </g>

  <!-- expanded card under the notch -->
  <g transform="translate(245,80)">
    <rect x="0" y="0" width="390" height="350" rx="20" fill="#0a0a0a" stroke="#222" stroke-width="0.5"/>

    <!-- header -->
    <text x="20" y="32" fill="#fff" font-size="12" font-weight="600" opacity="0.7">2 sessions</text>

    <!-- session card 1 -->
    <rect x="14" y="50" width="362" height="64" rx="10" fill="#161616"/>
    <polygon points="32,82 40,75 48,75 56,82 48,89 40,89" fill="url(#hex)"/>
    <text x="66" y="76" fill="#fff" font-size="13" font-weight="600">agent-island</text>
    <text x="66" y="93" fill="#fff" opacity="0.55" font-size="11">Editing PermissionDiffCard.swift</text>
    <rect x="296" y="68" width="68" height="22" rx="6" fill="#1f6feb"/>
    <text x="330" y="84" fill="#fff" font-size="11" text-anchor="middle">Jump</text>

    <!-- permission card -->
    <rect x="14" y="126" width="362" height="208" rx="12" fill="#000" stroke="#3a2e16" stroke-width="1"/>
    <circle cx="30" cy="144" r="6" fill="#ff9f0a"/>
    <text x="46" y="148" fill="#ff9f0a" font-size="12" font-weight="600">Permission needed</text>

    <rect x="20" y="160" width="56" height="22" rx="6" fill="#3a2614"/>
    <text x="48" y="176" fill="#ff9f0a" font-size="12" font-weight="700" text-anchor="middle">Bash</text>

    <rect x="20" y="190" width="350" height="64" rx="8" fill="#161616"/>
    <text x="30" y="210" fill="#fff" font-size="11" font-family="ui-monospace, Menlo, monospace">git reset --hard HEAD~5</text>
    <text x="30" y="232" fill="#ff453a" font-size="11" font-weight="700">⚠ Looks destructive — review carefully</text>

    <!-- buttons -->
    <rect x="20" y="266" width="170" height="44" rx="10" fill="#1a1a1a">
      <animate attributeName="fill" values="#1a1a1a;#221111;#1a1a1a" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="105" y="293" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">⌘N  Deny</text>

    <rect x="200" y="266" width="170" height="44" rx="10" fill="#1f6feb" opacity="0.85">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="285" y="293" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">⌘Y  Approve</text>
  </g>

  <!-- footer label -->
  <text x="440" y="445" fill="#fff" opacity="0.5" font-size="11" text-anchor="middle">Permission requests drop out of the notch — one click, you stay in your editor.</text>
</svg>
